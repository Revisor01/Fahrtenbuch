<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F5257" />
    <meta
      name="description"
      content="Dienstfahrten erfassen und monatlich abrechnen."
    />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Fahrtenbuch</title>
    <!-- Grundfarbe direkt im Dokument, nicht erst im Stylesheet: Die WebView
         zeigt das leere Dokument, sobald es geparst ist — bis das externe CSS
         geladen war, blitzte dort zwei Sekunden lang Weiss auf, mitten im
         Start (gemessen 16.08.). Petrol wie die native Startflaeche, damit
         der Uebergang nicht auffaellt. -->
    <style>
      html, body { margin: 0; background: #0F5257; }
    </style>
  </head>
  <body>
    <noscript>Für diese App muss JavaScript aktiviert sein.</noscript>
    <div id="root"></div>
    <!-- Laufzeit-Konfiguration: wird vom Container-Entrypoint ueberschrieben.
         Muss vor dem App-Bundle laufen — klassisches Script ohne defer wird
         ausgefuehrt, bevor das Modul-Bundle startet. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
