  <g transform="translate(1366 1366) scale(2.2) translate(-256 -256)">
    <path d="M159.2,158.3c54-53.4,141-53,194.5.9,53.4,54,53,141-.9,194.5-54,53.4-141,53-194.5-.9-25.7-25.9-40-61-39.8-97.4"
          fill="none" stroke="#ffffff" stroke-width="45"/>
    <circle cx="126.8" cy="202.2" r="26" fill="#e8b461"/>
  </g>
</svg>
