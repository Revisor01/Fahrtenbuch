<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 2732 2732">
  <!-- Startbildschirm der nativen App. Quadratisch, weil das Bild auf jedem
       Seitenverhaeltnis mittig beschnitten wird — das Motiv bleibt so immer
       vollstaendig sichtbar. Bewusst nur Ring und Punkt ohne Schriftzug:
       Text wuerde beim Beschneiden auf schmalen Geraeten anschneiden.
       Den Namen zeigt der React-Startbildschirm, der dieses Bild abloest. -->
