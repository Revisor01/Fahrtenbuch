<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 512 512">
  <!-- Vordergrundebene des adaptiven Android-Icons.
       Android beschneidet die Ebene je nach Geraeteform (Kreis, Squircle,
       Tropfen); sicher sichtbar sind nur die inneren rund 66 %. Das Motiv
