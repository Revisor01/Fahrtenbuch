# Sicherheits-Kopfzeilen für die ausgelieferte Oberfläche.
#
# Als eigene Datei und nicht direkt im server-Block, weil nginx `add_header`
# NICHT vererbt, sobald ein location-Block selbst ein `add_header` setzt — und
# genau das tun hier fünf Blöcke für die Cache-Steuerung. Ohne diese Datei in
# jedem einzelnen Block fehlten die Kopfzeilen ausgerechnet bei index.html,
# config.js, sw.js, manifest.json und /assets/.
#
# `always` ist Pflicht: Ohne das Schlüsselwort setzt nginx die Kopfzeilen nur
# bei 2xx/3xx. Die Oberfläche liefert über try_files reichlich 404 und 304.
#
# helmet() im Backend deckt nur die API ab — die Oberfläche kommt von nginx.
# HSTS steht hier bewusst nicht: TLS endet bei Caddy auf dem Server, dieser
# Container hört nur auf Port 80. Caddy setzt HSTS, X-Content-Type-Options
# und X-Frame-Options weiterhin selbst — die CSP dagegen kommt seit dem
# 24.09.2026 nur noch von hier, weil zwei CSP-Kopfzeilen nebeneinander
# gelten und der Browser dann die Schnittmenge anwendet. Das ist schwer
# nachzuvollziehen und stand einmal auf der Kippe, weil die Caddy-Fassung
# noch `plausible.godsapp.de` erlaubte, das es längst nicht mehr gibt.
#
# `upgrade-insecure-requests` stammt aus der Caddy-Fassung und ist beim
# Zusammenlegen hierher gewandert.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# script-src ohne 'unsafe-inline': index.html bindet beide Skripte per src ein
# (config.js und das Bundle), Inline-Skripte gibt es nicht.
#
# style-src braucht 'unsafe-inline' für den einen <style>-Block in
# index.html, der die Fläche vor dem ersten Rendern einfärbt (sonst blitzt
# Weiß auf). Ein Hash wäre strenger, müsste aber bei jeder Änderung dieser
# drei Zeilen nachgezogen werden.
#
# connect-src: 'self' für die eigene API (im Web liegt sie auf demselben Host
# — docker-entrypoint.sh setzt keine abweichende Basis), photon.komoot.io für
# die Adresssuche, dazu das Instanz-Verzeichnis. Der Wechsel des
# Kirchenkreises auf eine fremde Instanz gibt es nur in der App
# (EinstellungenView: nurNativ), und dort greift diese Datei nicht — das
# Bundle lädt in der App von capacitor://localhost.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://photon.komoot.io https://verzeichnis.kkd-fahrtenbuch.de https://kkd-fahrtenbuch.de; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
