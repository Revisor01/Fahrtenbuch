# Sicherheits-Kopfzeilen der Oberfläche, eigene Datei, weil nginx add_header nicht vererbt; `always` auch für 404/304; HSTS setzt Caddy, die CSP nur noch hier.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# script-src ohne 'unsafe-inline'; style-src mit, für den Farbblock in index.html; connect-src für API, Adresssuche und Instanz-Verzeichnis.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://photon.komoot.io https://verzeichnis.kkd-fahrtenbuch.de https://kkd-fahrtenbuch.de; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
