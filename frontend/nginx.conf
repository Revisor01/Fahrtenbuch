server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Sicherheits-Kopfzeilen. Sie stehen zusaetzlich in JEDEM location-Block
    # mit eigenem add_header — nginx vererbt add_header nicht, sobald ein
    # Block selbst eines setzt (siehe security-headers.conf).
    include /etc/nginx/security-headers.conf;

    # Der Service Worker steuert, was Clients aus dem Cache bekommen. Wird er
    # selbst gecacht, haengen Clients auf einer alten Version fest und bekommen
    # neue Deployments nie zu sehen.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Gleiches Argument: config.js wird beim Containerstart neu geschrieben und
    # traegt die instanzspezifischen Werte. index.html verweist auf die
    # gehashten Bundles.
    location = /config.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /manifest.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        expires -1;
    }

    # Vite vergibt Inhalts-Hashes in /assets — diese Dateien aendern sich nie
    # unter demselben Namen und duerfen daher lange liegen bleiben.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
