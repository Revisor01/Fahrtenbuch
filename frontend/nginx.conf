server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Zusätzlich in jedem location-Block mit eigenem add_header, nginx vererbt es nicht.
    include /etc/nginx/security-headers.conf;

    # Nicht cachen, sonst hängen Clients auf einer alten Version fest.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Nicht cachen, config.js wird beim Start neu geschrieben.
    location = /config.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /manifest.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        expires -1;
    }

    # Inhalts-Hashes, die Dateien ändern sich nie unter demselben Namen.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
