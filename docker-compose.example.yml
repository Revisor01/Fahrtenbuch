services:
  frontend:
    image: ghcr.io/revisor01/fahrtenbuch-app:latest
    ports:
      - "9642:80"
    environment:
      # Laufzeit-Konfiguration; REACT_APP_REGISTRATION_CODE steuert nur, ob das Codefeld erscheint.
      - REACT_APP_TITLE=${REACT_APP_TITLE}
      - REACT_APP_ALLOW_REGISTRATION=${REACT_APP_ALLOW_REGISTRATION}
      - REACT_APP_ALLOWED_EMAIL_DOMAINS=${REACT_APP_ALLOWED_EMAIL_DOMAINS}
      - REACT_APP_REGISTRATION_CODE=${REACT_APP_REGISTRATION_CODE}
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ghcr.io/revisor01/fahrtenbuch-server:latest
    # Nur lokal, sonst wäre die API ohne TLS aus dem Internet erreichbar.
    ports:
      - "127.0.0.1:5000:5000"
    # Zweite Sicherung neben SOFFICE_MAX_PARALLEL, sonst trifft der OOM-Killer die Datenbank.
    mem_limit: 1g
    environment:
      # Ohne production liefert Express im Fehlerfall HTML-Stacktraces aus
      - NODE_ENV=production
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      # Ohne Angabe 14 Tage, bei Nutzung gleitend erneuert.
      - TOKEN_LAUFZEIT=${TOKEN_LAUFZEIT:-14d}
      # API-Dokumentation unter /api-docs. Ohne beide Werte bleibt sie aus.
      - DOKU_USER=${DOKU_USER:-}
      - DOKU_PASSWORT=${DOKU_PASSWORT:-}
      # Kommaseparierte Web-Origins; die App-Origins sind fest eingebaut.
      - CORS_ORIGIN=${CORS_ORIGIN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      # SMTP_DEBUG=true schreibt Reset-Links in die Logs, nur zur Fehlersuche.
      - SMTP_DEBUG=${SMTP_DEBUG}
      - MAIL_FROM=${MAIL_FROM}
      - FRONTEND_URL=${FRONTEND_URL}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL}
      - INITIAL_ADMIN_USERNAME=${INITIAL_ADMIN_USERNAME}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - DEFAULT_ERSTATTUNG_TRAEGER=${DEFAULT_ERSTATTUNG_TRAEGER}
      - DEFAULT_ERSTATTUNG_MITFAHRER=${DEFAULT_ERSTATTUNG_MITFAHRER}
      - DEFAULT_ERSTATTUNG_DATUM=${DEFAULT_ERSTATTUNG_DATUM}
      # Serverseitige Registrierungs-Gates; leer heißt offen ohne Domain- oder Code-Pflicht.
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION}
      - ALLOWED_EMAIL_DOMAINS=${ALLOWED_EMAIL_DOMAINS}
      - REGISTRATION_CODE=${REGISTRATION_CODE}
      # Instanz-Verzeichnis für die Apps (id, name, https-apiUrl), leer heißt nur Dithmarschen.
      # INSTANZEN='[{"id":"dithmarschen","name":"Kirchenkreis Dithmarschen","apiUrl":"https://kkd-fahrtenbuch.de"}]'
      - INSTANZEN=${INSTANZEN}
    restart: unless-stopped
    depends_on:
      db:
        # Sonst startet das Backend vor MySQL und stürzt ab.
        condition: service_healthy

  db:
    # Fest 8.4, sonst zieht ein Pull ungefragt den nächsten Hauptstand.
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_INIT_COMMAND: "SET GLOBAL log_bin_trust_function_creators = 1;"
    volumes:
    # Eigenes Volume, damit das Backend keinen Rohzugriff auf die MySQL-Dateien hat.
      - fahrtenbuch_db:/var/lib/mysql
    # Kein Port-Mapping, ein veröffentlichter Port umginge die Host-Firewall.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --log_bin_trust_function_creators=1
    healthcheck:
      # Mit Zugangsdaten, ohne endet mysqladmin trotz „Access denied“ mit 0; $$, damit Compose die Variable durchreicht.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  fahrtenbuch_db:
