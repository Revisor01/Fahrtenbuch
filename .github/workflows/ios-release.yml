name: iOS Release Build

# Stößt den Xcode-Cloud-Workflow (Repo-Variable XCODE_CLOUD_WORKFLOW) an und wartet auf den TestFlight-Build.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bauen:
    uses: Revisor01/workflows/.github/workflows/xcode-cloud.yml@59236255da497972cdac8407c9af45d994ad0fcb # 1.4.1
    with:
      workflow-id: ${{ vars.XCODE_CLOUD_WORKFLOW }}
    secrets:
      asc-key-id: ${{ secrets.ASC_KEY_ID }}
      asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
      asc-key-p8: ${{ secrets.ASC_KEY_P8_BASE64 }}
