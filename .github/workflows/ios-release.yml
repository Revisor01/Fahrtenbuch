name: iOS Release Build

# Baut das iOS-Release auf einem GitHub-Runner mit RELEASE-macOS und laedt es
# zu App Store Connect hoch (TestFlight).
#
# Warum nicht lokal: Builds von Beta-macOS-Maschinen lehnt Apple mit
# ITMS-90111 ab (Beta-Host-Stempel im Binary). Simons Entwickler-Mac laeuft
# auf macOS-Beta — deshalb baut die CI. Uebernommen aus Konfi-Quest, wo
# genau das die Ursache war.
#
# Version und Build-Nummer stehen in frontend/ios/App/App.xcodeproj
# (MARKETING_VERSION / CURRENT_PROJECT_VERSION) und werden VOR dem Start
# hier im Repo gesetzt und committet — der Workflow zaehlt nicht selbst hoch,
# damit die hochgeladene Nummer immer einem Commit entspricht.
#
# SIGNIERUNG — bitte vor Aenderungen lesen (24.09.2026):
#
# Beides muss auf MANUELL stehen, sonst legt Xcode im Apple-Konto
# Development-Zertifikate an, bis das kontoweite Limit voll ist. Dann kann
# KEIN Projekt mehr bauen, auch nicht am Mac — Fahrtenbuch, Konfi Quest und
# Moin Kark teilen sich dieses Limit.
#
#   1. Die Release-Konfiguration in project.pbxproj
#      (CODE_SIGN_STYLE = Manual, CODE_SIGN_IDENTITY = "Apple Distribution",
#      PROVISIONING_PROFILE_SPECIFIER). Debug bleibt auf Development, sonst
#      laesst sich lokal nicht mehr aufs eigene Geraet bauen.
#   2. Die ExportOptions weiter unten (signingStyle: manual).
#
# Die zweite Stelle wird leicht uebersehen. `xcodebuild -help` zu
# signingStyle: „If your archive is manually signed and you choose to
# automatically sign when distributing, then Xcode will create provisioning
# profiles and managed cloud signing certificates as necessary." Der Export
# ist also ein eigenes Schlupfloch — das Projekt allein umzustellen genuegt
# nicht.
#
# `-allowProvisioningUpdates` gehoert deshalb NICHT mehr an xcodebuild. Fehlt
# ein Profil, soll der Lauf abbrechen und es sagen, statt sich still eins zu
# besorgen. Der Schritt „Provisioning-Profil laden" holt es ueber die
# ASC-API.
#
# Warum das monatelang unbemerkt blieb: Es wird nirgends etwas rot. Die
# Builds sind VALID, der Export re-signiert fuers App-Store-Ziel, und die
# Versionen gehen durch TestFlight und Store-Pruefung. Belegt am Log von
# Build 31 (Lauf 35933605897): „Signing Identity: Apple Development: Created
# via API" — das Archiv war falsch signiert, das Ergebnis trotzdem gueltig.
# Nur die Zahl im Konto stieg.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Neuestes stabiles Xcode waehlen
        run: |
          set -o pipefail
          # Beta-Installationen ausschliessen — genau deren Stempel verursachen ITMS-90111.
          #
          # Sortiert wird nach der Versionsnummer allein, nicht nach dem ganzen
          # Pfad: Bei gemischten Staenden kann ein naives `sort -V` ueber den
          # vollen Dateinamen die falsche Fassung waehlen (Hinweis aus
          # moin-kark). Hier zuerst die Nummer herausloesen, sortieren, dann
          # den Pfad wieder zusammensetzen.
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | grep -iv beta \
            | sed 's#^/Applications/Xcode_##; s#\.app$##' \
            | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            XCODE="/Applications/Xcode_${XCODE}.app"
          else
            XCODE=/Applications/Xcode.app
          fi
          echo "Verwende: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          # Mindestens 22: Die Capacitor-CLI bricht darunter ab
          # ("The Capacitor CLI requires NodeJS >=22.0.0"). Die Dockerfiles
          # bauen mit 20 — das betrifft aber nur den Web-Container, in dem
          # kein cap sync laeuft.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Web-Build + Capacitor-Sync
        working-directory: frontend
        # Die Laufzeit-Konfiguration (API-Basis, Titel) kommt in dieser App
        # NICHT aus Build-Variablen, sondern aus public/config.js bzw. der
        # Instanzwahl beim ersten Start. Hier ist deshalb nichts zu setzen.
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx cap sync ios

      - name: Version und Build-Nummer pruefen
        working-directory: frontend/ios/App
        # VOR dem Archiv pruefen, nicht danach: Apple lehnt ein falsches
        # Versionsformat erst beim Upload ab — das kostet den ganzen Lauf.
        # Ausserdem muessen beide Build-Konfigurationen (Debug/Release)
        # denselben Wert tragen, sonst laedt man eine andere Nummer hoch als
        # die, die im Repo steht.
        run: |
          set -o pipefail
          VERSION=$(grep -m1 'MARKETING_VERSION' App.xcodeproj/project.pbxproj | sed 's/.*= *//; s/;//')
          BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION' App.xcodeproj/project.pbxproj | sed 's/.*= *//; s/;//')
          echo "Version: $VERSION, Build: $BUILD"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "Version '$VERSION' passt nicht zu Apples Format (x.y oder x.y.z)."
            exit 1
          fi
          if ! echo "$BUILD" | grep -Eq '^[0-9]+$'; then
            echo "Build-Nummer '$BUILD' ist nicht rein numerisch."
            exit 1
          fi

          # Alle Vorkommen muessen uebereinstimmen — sonst baut Release mit
          # einem anderen Wert als erwartet.
          if [ "$(grep -c "MARKETING_VERSION = $VERSION;" App.xcodeproj/project.pbxproj)" \
             != "$(grep -c 'MARKETING_VERSION' App.xcodeproj/project.pbxproj)" ]; then
            echo "MARKETING_VERSION steht nicht ueberall auf $VERSION."
            grep -n 'MARKETING_VERSION' App.xcodeproj/project.pbxproj
            exit 1
          fi
          if [ "$(grep -c "CURRENT_PROJECT_VERSION = $BUILD;" App.xcodeproj/project.pbxproj)" \
             != "$(grep -c 'CURRENT_PROJECT_VERSION' App.xcodeproj/project.pbxproj)" ]; then
            echo "CURRENT_PROJECT_VERSION steht nicht ueberall auf $BUILD."
            grep -n 'CURRENT_PROJECT_VERSION' App.xcodeproj/project.pbxproj
            exit 1
          fi
          echo "Version und Build-Nummer sind stimmig."

      - name: Signing-Keychain einrichten
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > dist.p12
          security create-keychain -p ci-build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-build build.keychain
          security set-keychain-settings -t 3600 build.keychain
          security import dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-build build.keychain >/dev/null
          rm dist.p12

      - name: ASC-API-Key ablegen
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # Bei manueller Signierung sucht Xcode das Profil im lokalen Ordner und
      # legt sich keins an. Ohne diesen Schritt bricht der Build ab, statt
      # sich still ein Development-Zertifikat zu besorgen — das ist gewollt:
      # ein fehlendes Profil soll auffallen, nicht umgangen werden.
      - name: Provisioning-Profil laden
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # JWT fuer die App-Store-Connect-API (ES256, 10 Minuten gueltig)
          python3 - <<'PYEOF' > /tmp/asc.jwt
          import base64, json, os, time
          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives import hashes

          def b64(o):
              roh = o if isinstance(o, bytes) else json.dumps(o, separators=(',', ':')).encode()
              return base64.urlsafe_b64encode(roh).rstrip(b'=')

          schluessel = load_pem_private_key(
              base64.b64decode(os.environ['ASC_KEY_P8_BASE64']), password=None)
          kopf = {'alg': 'ES256', 'kid': os.environ['ASC_KEY_ID'], 'typ': 'JWT'}
          rumpf = {'iss': os.environ['ASC_ISSUER_ID'], 'iat': int(time.time()),
                   'exp': int(time.time()) + 600, 'aud': 'appstoreconnect-v1'}
          zuSignieren = b64(kopf) + b'.' + b64(rumpf)
          roh = schluessel.sign(zuSignieren, ec.ECDSA(hashes.SHA256()))
          r, s = decode_dss_signature(roh)
          print((zuSignieren + b'.' + b64(r.to_bytes(32, 'big') + s.to_bytes(32, 'big'))).decode())
          PYEOF

          JWT=$(cat /tmp/asc.jwt)
          NAME="Fahrtenbuch AppStore"
          PROFIL=$(curl -s -H "Authorization: Bearer $JWT" \
            "https://api.appstoreconnect.apple.com/v1/profiles?limit=200&fields%5Bprofiles%5D=name,profileContent")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFIL" | python3 -c "
          import json, sys, base64, pathlib, os
          daten = json.load(sys.stdin).get('data', [])
          treffer = [p for p in daten if p['attributes']['name'] == os.environ['NAME']]
          if not treffer:
              print('Profil \'' + os.environ['NAME'] + '\' nicht gefunden. Vorhanden:', file=sys.stderr)
              for p in daten: print('  -', p['attributes']['name'], file=sys.stderr)
              sys.exit(1)
          ziel = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles' / (treffer[0]['id'] + '.mobileprovision')
          ziel.write_bytes(base64.b64decode(treffer[0]['attributes']['profileContent']))
          print('Profil abgelegt:', ziel)
          "
          rm -f /tmp/asc.jwt

      - name: Archiv bauen
        working-directory: frontend/ios/App
        # -project, nicht -workspace: Diese App bindet die Capacitor-Plugins
        # ueber Swift Package Manager ein (CapApp-SPM), es gibt kein Podfile
        # und damit auch keinen Workspace.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive archive \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40

      - name: IPA exportieren
        working-directory: frontend/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > ExportOptions-ci.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <!-- manual passend zum Projekt: Bei automatic durfte Xcode sich
                 fehlende Anmeldedaten selbst besorgen und legte dafuer
                 Development-Zertifikate im Konto an. -->
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>de.godsapp.fahrtenbuch</key><string>Fahrtenbuch AppStore</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>teamID</key><string>J459G9CJT5</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportPath build/export -exportOptionsPlist ExportOptions-ci.plist \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -10

      - name: Zu App Store Connect hochladen
        working-directory: frontend/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        # set -e ist hier zwingend: Ohne das meldete der Schritt Erfolg,
        # obwohl altool mit Netzwerk-Timeouts abbrach (Lauf 35844707667 war
        # gruen, Build 30 kam nie in ASC an).
        #
        # Drei Versuche: Der Upload laeuft ueber Apples Content-Delivery und
        # laeuft dort gelegentlich in -1001 (request timed out) — ein
        # einzelner Abbruch heisst nicht, dass etwas falsch konfiguriert ist.
        run: |
          set -e
          for versuch in 1 2 3; do
            echo "--- Upload-Versuch $versuch von 3 ---"
            if xcrun altool --upload-app -f build/export/App.ipa -t ios \
                 --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"; then
              echo "Upload erfolgreich."
              exit 0
            fi
            if [ "$versuch" -lt 3 ]; then
              echo "Fehlgeschlagen, neuer Versuch in 60 s."
              sleep 60
            fi
          done
          echo "Upload nach drei Versuchen fehlgeschlagen."
          exit 1
