name: Docker Build & Push

on:
  push:
    branches: 
      - 'master'
    tags:
      - 'v*'
  pull_request:
    branches: 
      - 'master'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Docker tags backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: revisoren/fahrtenbuch-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set Docker tags frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: revisoren/fahrtenbuch-app
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: revisoren
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Kein automatischer Deploy mehr an dieser Stelle: Hier stand ein Aufruf
      # eines Portainer-Webhooks, aber auf dem Zielserver laeuft kein
      # Portainer. Der Aufruf lief ohne Fehler ins Leere — die CI meldete
      # Erfolg, waehrend auf dem Server tagealte Images liefen.
      #
      # Ausgerollt wird jetzt bewusst von Hand, in dieser Reihenfolge:
      #   ./deploy/deploy.sh test           immer zuerst
      #   ./deploy/deploy.sh dithmarschen   Referenzinstanz
      #   ./deploy/deploy.sh alle           uebrige Kirchenkreise
      # Das Skript sichert vorher die Datenbank und prueft hinterher, ob der
      # neue Stand wirklich laeuft.
      - name: Hinweis zum Ausrollen
        if: github.event_name != 'pull_request'
        run: echo "Images gebaut. Ausrollen mit ./deploy/deploy.sh <instanz>"
