name: Docker Build & Push

# Baut und veröffentlicht die Images. Ausgerollt wird von Hand mit
# ./deploy/deploy.sh <instanz> (test, dann dithmarschen, dann alle); das Skript
# sichert vorher die Datenbank und prüft hinterher den neuen Stand.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  image:
    strategy:
      matrix:
        include:
          - teil: backend
            image: ghcr.io/revisor01/fahrtenbuch-server
          - teil: frontend
            image: ghcr.io/revisor01/fahrtenbuch-app
    permissions:
      contents: read
      packages: write
    uses: Revisor01/workflows/.github/workflows/docker-image.yml@5bb9fc1d9e2cd728029f334f50bbe355f005eef5 # 1.3.1
    with:
      image: ${{ matrix.image }}
      kontext: ./${{ matrix.teil }}
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest,enable={{is_default_branch}}
