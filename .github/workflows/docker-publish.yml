name: Docker Build & Push

# Baut und veröffentlicht die Images. Ausgerollt wird von Hand mit
# ./deploy/deploy.sh <instanz> (test, dann dithmarschen, dann alle); das Skript
# sichert vorher die Datenbank und prüft hinterher den neuen Stand.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  image:
    strategy:
      matrix:
        include:
          - teil: backend
            image: revisoren/fahrtenbuch-server
          - teil: frontend
            image: revisoren/fahrtenbuch-app
    uses: Revisor01/workflows/.github/workflows/docker-image.yml@9eb921a3c730493b1aea79d5b22bf655356d5e43 # 1.2.0
    with:
      image: ${{ matrix.image }}
      kontext: ./${{ matrix.teil }}
      registry-benutzer: revisoren
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest,enable={{is_default_branch}}
    secrets:
      registry-token: ${{ secrets.DOCKERHUB_TOKEN }}
