name: Docker Build & Push

# Baut und veröffentlicht die Images; ausgerollt wird von Hand mit ./deploy/deploy.sh <instanz>.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  image:
    strategy:
      matrix:
        include:
          - teil: backend
            image: ghcr.io/revisor01/fahrtenbuch-server
          - teil: frontend
            image: ghcr.io/revisor01/fahrtenbuch-app
    permissions:
      contents: read
      packages: write
    uses: Revisor01/workflows/.github/workflows/docker-image.yml@3ec878449b89e1a69714b87381cb8effd7075fef # 1.5.1
    with:
      image: ${{ matrix.image }}
      kontext: ./${{ matrix.teil }}
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest,enable={{is_default_branch}}
