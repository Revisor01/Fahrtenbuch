name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Ohne LibreOffice ueberspringt der PDF-Test die Umwandlung stillschweigend.
      # Der Azure-Paketspiegel liefert die rund 94 MB zeitweise nur mit
      # wenigen KB/s. Deshalb liegen die Pakete im Actions-Cache (eine Woche
      # gueltig), und bei einem Fehlversuch wechselt apt auf den Ubuntu-Spiegel.
      - name: Cache-Schluessel fuer LibreOffice
        id: lo-woche
        run: echo "woche=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: LibreOffice-Pakete aus dem Cache
        id: lo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archive
          key: libreoffice-calc-ubuntu-24.04-${{ steps.lo-woche.outputs.woche }}
          restore-keys: libreoffice-calc-ubuntu-24.04-

      - name: LibreOffice Calc installieren
        timeout-minutes: 12
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          mkdir -p ~/apt-archive/partial
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
                    -o Dir::Cache::Archives="$HOME/apt-archive" -o APT::Sandbox::User=root)
          for versuch in 1 2 3; do
            start=$(date +%s)
            if timeout 90 sudo apt-get "${apt_opts[@]}" update -qq \
              && timeout 180 sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends libreoffice-calc; then
              echo "LibreOffice in Versuch $versuch nach $(( $(date +%s) - start )) s installiert."
              sudo chown -R "$(id -u):$(id -g)" ~/apt-archive
              exit 0
            fi
            echo "::warning::Versuch $versuch fehlgeschlagen, neuer Versuch ueber archive.ubuntu.com."
            # Ein abgebrochenes apt kann dpkg halb fertig zuruecklassen.
            sudo dpkg --configure -a || true
            # Halb geladene Pakete bleiben in partial/ und werden fortgesetzt.
            for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
              [ -f "$f" ] && sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$f"
            done
            sleep 5
          done
          exit 1

      - name: LibreOffice-Pakete in den Cache
        if: steps.lo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archive
          key: libreoffice-calc-ubuntu-24.04-${{ steps.lo-woche.outputs.woche }}

      - name: Abhaengigkeiten
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Backend-Tests
        working-directory: backend
        run: npm test
