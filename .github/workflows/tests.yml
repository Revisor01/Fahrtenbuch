name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Ohne LibreOffice überspringt der PDF-Test still; Pakete im Cache, weil der Azure-Spiegel zeitweise nur KB/s liefert.
      - name: Cache-Schluessel fuer LibreOffice
        id: lo-woche
        run: echo "woche=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: LibreOffice-Pakete aus dem Cache
        id: lo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archive
          key: libreoffice-calc-ubuntu-24.04-${{ steps.lo-woche.outputs.woche }}
          restore-keys: libreoffice-calc-ubuntu-24.04-

      - name: LibreOffice Calc installieren
        timeout-minutes: 12
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          mkdir -p ~/apt-archive/partial
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
                    -o Dir::Cache::Archives="$HOME/apt-archive" -o APT::Sandbox::User=root)
          for versuch in 1 2 3; do
            start=$(date +%s)
            if timeout 90 sudo apt-get "${apt_opts[@]}" update -qq \
              && timeout 180 sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends libreoffice-calc; then
              echo "LibreOffice in Versuch $versuch nach $(( $(date +%s) - start )) s installiert."
              sudo chown -R "$(id -u):$(id -g)" ~/apt-archive
              exit 0
            fi
            echo "::warning::Versuch $versuch fehlgeschlagen, neuer Versuch ueber archive.ubuntu.com."
            # Ein abgebrochenes apt kann dpkg halb fertig zuruecklassen.
            sudo dpkg --configure -a || true
            # Halb geladene Pakete bleiben in partial/ und werden fortgesetzt.
            for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
              [ -f "$f" ] && sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' "$f"
            done
            sleep 5
          done
          exit 1

      - name: LibreOffice-Pakete in den Cache
        if: steps.lo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archive
          key: libreoffice-calc-ubuntu-24.04-${{ steps.lo-woche.outputs.woche }}

      - name: Abhaengigkeiten
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Backend-Tests
        working-directory: backend
        run: npm test

  # Antwortformen sind ein Vertrag mit den Store-Apps: dieselbe Anfragefolge gegen Basis und PR, neue Felder erlaubt.
  api-vertrag:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: vertrag
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pvertrag"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: vertrag
      JWT_SECRET: vertrag-vertrag-vertrag-vertrag-vertrag
      INITIAL_ADMIN_USERNAME: vertragsadmin
      INITIAL_ADMIN_PASSWORD: vertrag-passwort-1
      INITIAL_ADMIN_EMAIL: admin@example.org
      DEFAULT_ERSTATTUNG_TRAEGER: "0.30"
      DEFAULT_ERSTATTUNG_MITFAHRER: "0.05"
      DEFAULT_ERSTATTUNG_DATUM: "2024-01-01"
      CORS_ORIGIN: http://localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: neu
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.base_ref }}
          path: alt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Datenbanken anlegen
        run: |
          for db in fb_alt fb_neu; do
            mysql -h 127.0.0.1 -uroot -pvertrag -e "CREATE DATABASE $db CHARACTER SET utf8mb4"
          done

      - name: Abhaengigkeiten
        run: |
          npm ci --prefix alt/backend --no-audit --no-fund
          npm ci --prefix neu/backend --no-audit --no-fund

      - name: Beide Fassungen starten
        run: |
          (cd alt/backend && DB_NAME=fb_alt PORT=5101 node app.js > ../../alt.log 2>&1 &)
          (cd neu/backend && DB_NAME=fb_neu PORT=5102 node app.js > ../../neu.log 2>&1 &)
          for port in 5101 5102; do
            for i in $(seq 1 60); do
              curl -sf "http://127.0.0.1:$port/api/instanzen" >/dev/null && break
              sleep 1
            done
            curl -sf "http://127.0.0.1:$port/api/instanzen" >/dev/null || { cat alt.log neu.log; exit 1; }
          done

      - name: Anfragefolge und Vergleich
        run: |
          node neu/backend/test/vertrag/anfragefolge.js http://127.0.0.1:5101 alt.json
          VERTRAG_INHALT=neu-inhalt.json node neu/backend/test/vertrag/anfragefolge.js http://127.0.0.1:5102 neu.json
          node neu/backend/test/vertrag/vergleich.js alt.json neu.json

      - name: Antworten als Testdaten
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-vertrag
          path: |
            alt.json
            neu.json
            neu-inhalt.json
          retention-days: 7

      - name: Protokolle bei Fehler
        if: failure()
        run: |
          echo "--- alt.log"; tail -n 80 alt.log || true
          echo "--- neu.log"; tail -n 80 neu.log || true
          echo "--- neu.json"; cat neu.json || true
