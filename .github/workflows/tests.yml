name: Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Ohne LibreOffice ueberspringt der PDF-Test die Umwandlung stillschweigend.
      # Der Paketspiegel hängt gelegentlich; kurze Timeouts und neue Versuche
      # statt eines Laufs, der nach Minuten abbricht.
      - name: LibreOffice Calc installieren
        timeout-minutes: 12
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          for versuch in 1 2 3; do
            if timeout 90 sudo apt-get "${apt_opts[@]}" update -qq \
              && timeout 150 sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends libreoffice-calc; then
              exit 0
            fi
            echo "::warning::Versuch $versuch fehlgeschlagen, neuer Versuch."
            # Ein abgebrochenes apt kann dpkg halb fertig zurücklassen.
            sudo dpkg --configure -a || true
            sleep 10
          done
          exit 1

      - name: Abhaengigkeiten
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Backend-Tests
        working-directory: backend
        run: npm test
