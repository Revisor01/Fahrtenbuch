name: CodeQL

# Statische Sicherheitsanalyse, auch wöchentlich, damit neue Regeln auf unverändertem Code greifen.

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master]
  schedule:
    # Montags um 5:30 UTC
    - cron: '30 5 * * 1'

jobs:
  analyze:
    name: Analyse (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          # security-and-quality findet zusätzlich Wartbarkeitsprobleme.
          queries: security-and-quality

      - name: Analyse
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:${{ matrix.language }}'
